<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>AR Try-On — Wall</title>
<style>
  :root { color-scheme: dark; --ap-blue: #29c5e8; }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: #0d0d0f; font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; color: #fff; overflow: hidden; }

  /* ---- Intro / status ---- */
  #intro {
    position: fixed; inset: 0; z-index: 30;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 32px; gap: 18px;
    background: radial-gradient(circle at 50% 30%, #1c1c22, #0d0d0f);
  }
  #intro h1 { font-size: 22px; font-weight: 650; }
  #intro p { font-size: 14px; line-height: 1.5; color: #a8a8b0; max-width: 320px; }
  #startBtn {
    margin-top: 8px; padding: 15px 34px; font-size: 16px; font-weight: 600;
    border: none; border-radius: 100px; background: #f5f3ee; color: #16161a;
    cursor: pointer;
  }
  #startBtn:active { transform: scale(0.97); }
  #unsupported { display: none; color: #ff8a80; font-size: 13px; max-width: 320px; }

  /* ---- HUD during AR (dom-overlay) ---- */
  #hud { position: fixed; inset: 0; z-index: 20; display: none; pointer-events: none; }
  #status {
    position: absolute; top: env(safe-area-inset-top, 14px); left: 50%;
    transform: translateX(-50%); margin-top: 14px;
    background: rgba(0,0,0,0.62); backdrop-filter: blur(8px);
    padding: 9px 18px; border-radius: 100px; font-size: 13px; white-space: nowrap;
  }
  #exitBtn {
    position: absolute; top: env(safe-area-inset-top, 14px); right: 14px; margin-top: 14px;
    width: 38px; height: 38px; border-radius: 50%; pointer-events: auto;
    background: rgba(0,0,0,0.62); border: none; color: #fff; font-size: 18px; cursor: pointer;
  }
  #toast {
    position: absolute; bottom: 150px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.8); padding: 8px 16px; border-radius: 100px;
    font-size: 12px; opacity: 0; transition: opacity .25s; white-space: nowrap;
  }

  /* ---- size picker (AllPosters style) ---- */
  #sizeBar {
    position: absolute; left: 0; right: 0;
    bottom: calc(env(safe-area-inset-bottom, 16px) + 70px);
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    pointer-events: none;
  }
  #sizeLabel {
    font-size: 12px; font-weight: 600; color: #fff;
    text-shadow: 0 1px 3px rgba(0,0,0,0.9); letter-spacing: 0.3px;
  }
  #sizeBtns { display: flex; gap: 8px; pointer-events: auto; }
  .size-btn {
    min-width: 78px; padding: 11px 10px;
    font-size: 13px; font-weight: 600; text-align: center;
    background: #ffffff; color: #1a1a1a;
    border: 1px solid #cfcfcf; border-radius: 4px;
    cursor: pointer; transition: background .12s, color .12s, border-color .12s;
  }
  .size-btn:active { transform: scale(0.97); }
  .size-btn.active {
    background: var(--ap-blue); color: #ffffff; border-color: var(--ap-blue);
  }

  /* ---- bottom bar (reset) ---- */
  #bottomBar {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 14px 16px calc(env(safe-area-inset-bottom, 16px) + 14px);
    display: flex; gap: 10px; justify-content: center; pointer-events: auto;
  }
  .pill {
    padding: 13px 20px; font-size: 14px; font-weight: 600; border-radius: 100px;
    border: 1px solid rgba(255,255,255,0.18); background: rgba(20,20,24,0.78);
    backdrop-filter: blur(8px); color: #fff; cursor: pointer;
  }
  .pill:active { transform: scale(0.96); }
  .pill.hidden { display: none; }

  /* ===== debug panel ===== */
  #debugPanel {
    position: absolute; left: 8px; right: 8px;
    top: calc(env(safe-area-inset-top, 14px) + 60px);
    height: 38vh; display: flex; flex-direction: column;
    background: rgba(0,0,0,0.82); border: 1px solid rgba(124,255,178,0.4);
    border-radius: 10px; pointer-events: auto; overflow: hidden;
  }
  #debugLog {
    flex: 1; overflow-y: auto; padding: 8px 10px;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 10px; line-height: 1.45; color: #b9f5cf;
    white-space: pre-wrap; word-break: break-word;
  }
  #debugLog .warn { color: #ffd27c; }
  #debugLog .err  { color: #ff8a80; }
  #debugLog .ok   { color: #7CFFB2; }
  #debugBtns { display: flex; border-top: 1px solid rgba(255,255,255,0.12); }
  .dbg {
    flex: 1; padding: 10px 4px; font-size: 12px; font-weight: 600;
    background: rgba(20,20,24,0.9); color: #fff; border: none;
    border-right: 1px solid rgba(255,255,255,0.1); cursor: pointer;
  }
  .dbg:last-child { border-right: none; }
  .dbg:active { background: rgba(124,255,178,0.2); }
  #showLogBtn {
    position: absolute; left: 14px;
    top: calc(env(safe-area-inset-top, 14px) + 14px);
    padding: 7px 12px; font-size: 11px; font-weight: 700; letter-spacing: 0.5px;
    background: rgba(0,0,0,0.62); border: 1px solid rgba(124,255,178,0.5);
    color: #7CFFB2; border-radius: 8px; pointer-events: auto; cursor: pointer;
  }
  #debugPanel.hidden, #showLogBtn.hidden { display: none; }
</style>
</head>
<body>

<div id="intro">
  <h1>Wall Try-On</h1>
  <p>Point the camera at the <b>wall</b> where you want to see the poster. Move the phone slowly so AR can recognize the surface, then tap to place it.</p>
  <button id="startBtn">Start camera</button>
  <p id="unsupported">⚠️ This device/browser does not support WebXR AR.<br>Use <b>Google Chrome</b> on an Android device with ARCore.</p>
</div>

<div id="hud">
  <div id="status">Starting…</div>
  <button id="exitBtn">✕</button>
  <div id="toast"></div>

  <!-- ===== debug panel ===== -->
  <div id="debugPanel">
    <div id="debugLog"></div>
    <div id="debugBtns">
      <button class="dbg" id="copyLogBtn">Copy log</button>
      <button class="dbg" id="clearLogBtn">Clear</button>
      <button class="dbg" id="hideLogBtn">Hide</button>
    </div>
  </div>
  <button id="showLogBtn">LOG</button>

  <!-- ===== size picker ===== -->
  <div id="sizeBar">
    <div id="sizeLabel">Choose size</div>
    <div id="sizeBtns">
      <button class="size-btn" data-size="0">13" × 19"</button>
      <button class="size-btn" data-size="1">15" × 22"</button>
      <button class="size-btn active" data-size="2">22" × 34"</button>
    </div>
  </div>

  <div id="bottomBar">
    <button class="pill hidden" id="resetBtn">Reposition</button>
  </div>
</div>

<!-- three.js + loaders via CDN (ES modules) -->
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// ===================== CONFIG =====================
// GLB URL. Any GLB works: the code measures and adapts orientation/origin.
const MODEL_URL  = './poster.glb';

// Scale multiplier. Blender's glTF exporter always writes meters, even if
// the scene Unit is cm. This GLB came in meters, so MODEL_SCALE = 1.0.
const MODEL_SCALE = 1.0;

// Auto-recenter the model origin at the bounding-box center. Keep true.
const MODEL_AUTOCENTER = true;

// ---- Available poster sizes (inches -> meters) ----
// 1 inch = 0.0254 m. Button 3 (22x34) is the current/default poster.
const SIZES = [
  { label: '13" x 19"', w: 13 * 0.0254, h: 19 * 0.0254 },  // ~0.330 x 0.483 m
  { label: '15" x 22"', w: 15 * 0.0254, h: 22 * 0.0254 },  // ~0.381 x 0.559 m
  { label: '22" x 34"', w: 22 * 0.0254, h: 34 * 0.0254 }   // ~0.559 x 0.864 m
];
let currentSizeIndex = 2;   // default = button 3

// ---- Tracking ----
const WALL_OFFSET = 0.010;  // distance (m) the poster sits off the wall — ~1cm, looks hung flush
// How "vertical" a surface must be to count as a wall.
// 1 = perfectly vertical. 0.82 ~= tolerates up to ~35deg of tilt.
const VERTICAL_DOT_MIN = 0.82;
// ==================================================

const statusEl = document.getElementById('status');
const introEl  = document.getElementById('intro');
const hudEl    = document.getElementById('hud');
const toastEl  = document.getElementById('toast');
const startBtn = document.getElementById('startBtn');
const exitBtn  = document.getElementById('exitBtn');
const resetBtn = document.getElementById('resetBtn');
const sizeBtns = Array.from(document.querySelectorAll('.size-btn'));

// ===== debug engine =====
const debugPanel = document.getElementById('debugPanel');
const debugLogEl = document.getElementById('debugLog');
const DBG = {
  lines: [], max: 400, t0: performance.now(),
  push(msg, cls){
    const t = ((performance.now() - this.t0) / 1000).toFixed(2);
    this.lines.push({ text: '[' + t + 's] ' + msg, cls: cls || '' });
    if (this.lines.length > this.max) this.lines.shift();
    this.render();
  },
  render(){
    if (!debugLogEl) return;
    debugLogEl.innerHTML = this.lines
      .map(l => l.cls ? '<span class="'+l.cls+'">'+esc(l.text)+'</span>' : esc(l.text))
      .join('\n');
    debugLogEl.scrollTop = debugLogEl.scrollHeight;
  },
  text(){ return this.lines.map(l => l.text).join('\n'); }
};
function esc(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

document.getElementById('showLogBtn').addEventListener('click', ()=>{
  debugPanel.classList.remove('hidden');
  document.getElementById('showLogBtn').classList.add('hidden');
});
document.getElementById('hideLogBtn').addEventListener('click', ()=>{
  debugPanel.classList.add('hidden');
  document.getElementById('showLogBtn').classList.remove('hidden');
});
document.getElementById('clearLogBtn').addEventListener('click', ()=>{
  DBG.lines = []; DBG.render();
});
document.getElementById('copyLogBtn').addEventListener('click', async ()=>{
  const txt = DBG.text();
  try {
    await navigator.clipboard.writeText(txt);
    toast('Log copied — paste it in chat');
  } catch(e){
    const ta = document.createElement('textarea');
    ta.value = txt; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast('Log copied'); }
    catch(e2){ toast('Copy it manually from the panel'); }
    document.body.removeChild(ta);
  }
});

let renderer, scene, camera;
let reticle, sizePreview, posterModel, posterPlaced = false;
let xrSession = null, xrRefSpace = null, viewerSpace = null;
let hitTestSource = null;
let modelTemplate = null;     // loaded GLB, cloned on placement
let toastTimer = null;

// pose (position+rotation) where the poster is fixed on the wall,
// kept SEPARATE from scale so resizing keeps the same center point.
let placedPose = new THREE.Matrix4();        // FLUSH wall pose (no offset)
let posterTargetPose = new THREE.Matrix4();  // OFFSET pose — what the poster uses

// tracking smoothing state (constants live near the render loop):
// the ARCore hit-test flickers on plain/dim walls — drops to 0 hits for
// a few frames then recovers. We hold the last good wall pose briefly and
// lerp toward new ones so the reticle glides instead of blinking.
let lastWallPose = null;        // THREE.Matrix4 of the last good wall pose
let lastWallTime = -1e9;        // timestamp of the last good wall hit

// ---- WebXR anchors ----
// When the poster is placed we create an XRAnchor. ARCore then keeps that
// anchor correct as it refines its map — the poster stays glued to the
// wall instead of drifting. createAnchor needs an XRFrame, which the
// 'select' event doesn't carry, so onSelect just sets pendingPlacement
// and the anchor is actually created inside onXRFrame.
let posterAnchor = null;        // the active XRAnchor (null until placed)
let pendingPlacement = null;    // { pose: XRRigidTransform } awaiting anchor
let anchorSupported = false;    // set true once we confirm the API exists

function setStatus(t){ statusEl.textContent = t; }
function toast(t){
  toastEl.textContent = t; toastEl.style.opacity = 1;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ toastEl.style.opacity = 0; }, 2200);
}

// ---- support check ----
async function checkSupport(){
  if (!('xr' in navigator)) return false;
  try { return await navigator.xr.isSessionSupported('immersive-ar'); }
  catch(e){ return false; }
}

checkSupport().then(ok => {
  DBG.push('=== AR Try-On debug ===');
  DBG.push('UA: ' + navigator.userAgent);
  DBG.push('WebXR immersive-ar supported: ' + ok, ok ? 'ok' : 'err');
  DBG.push('screen: ' + innerWidth + 'x' + innerHeight + ' dpr=' + devicePixelRatio);
  if (!ok){
    startBtn.style.display = 'none';
    document.getElementById('unsupported').style.display = 'block';
  }
});

// nativeSize = the GLB's own measured size (m). The poster is then
// rescaled per the SIZES table. depth scales with the average factor.
let nativeSize = { width: 0.6, height: 0.9, depth: 0.02 };
// posterSize = the currently selected real-world size (m).
let posterSize = { width: 0.6, height: 0.9, depth: 0.02 };

// ---- load + normalize the GLB ----
function preloadModel(){
  DBG.push('loading GLB: ' + MODEL_URL);
  return new Promise((resolve, reject)=>{
    new GLTFLoader().load(MODEL_URL,
      gltf => {
        try {
          modelTemplate = normalizeModel(gltf.scene);
          DBG.push('GLB OK -> native size ' + nativeSize.width.toFixed(3) + ' x '
            + nativeSize.height.toFixed(3) + ' x ' + nativeSize.depth.toFixed(4)
            + ' m', 'ok');
          resolve();
        } catch(e){
          DBG.push('ERROR normalizing GLB: ' + e.message, 'err');
          reject(e);
        }
      },
      undefined,
      err => {
        DBG.push('ERROR loading GLB: ' + (err && err.message || err), 'err');
        reject(err);
      }
    );
  });
}

// Normalize: thin axis -> +Z, origin -> center, apply MODEL_SCALE.
// Returns a group whose own scale is 1 (so we can scale it freely later).
function normalizeModel(root){
  let box = new THREE.Box3().setFromObject(root);
  let size = new THREE.Vector3(); box.getSize(size);
  let center = new THREE.Vector3(); box.getCenter(center);

  const dims = [size.x, size.y, size.z];
  const thinAxis = dims.indexOf(Math.min(...dims)); // 0=x,1=y,2=z

  const centered = new THREE.Group();
  if (MODEL_AUTOCENTER) root.position.sub(center);
  centered.add(root);

  if (thinAxis === 0)       centered.rotation.y =  Math.PI / 2;
  else if (thinAxis === 1)  centered.rotation.x = -Math.PI / 2;

  const scaled = new THREE.Group();
  centered.scale.setScalar(MODEL_SCALE);
  scaled.add(centered);

  let box2 = new THREE.Box3().setFromObject(scaled);
  let size2 = new THREE.Vector3(); box2.getSize(size2);

  nativeSize = { width: size2.x, height: size2.y, depth: size2.z };
  console.log('[AR] native poster size (m):', nativeSize,
              ' thin axis:', ['X','Y','Z'][thinAxis]);
  return scaled;
}

// Build the THREE scale factors that turn the native GLB size into the
// chosen real-world size. X and Y map to width/height; depth uses the
// average so thickness stays sensible.
function scaleForSize(idx){
  const s = SIZES[idx];
  const fx = s.w / nativeSize.width;
  const fy = s.h / nativeSize.height;
  const fz = (fx + fy) / 2;
  return new THREE.Vector3(fx, fy, fz);
}

// Apply a size to the poster + preview, keeping the SAME wall pose
// (center point stays fixed; it scales from the center).
function applySize(idx, fromUser){
  currentSizeIndex = idx;
  const f = scaleForSize(idx);
  posterSize = {
    width: SIZES[idx].w,
    height: SIZES[idx].h,
    depth: nativeSize.depth * f.z
  };

  // update button states
  sizeBtns.forEach(b => {
    b.classList.toggle('active', Number(b.dataset.size) === idx);
  });

  // rebuild the size preview outline at the new dimensions
  refreshSizePreview();

  // if the poster is already on the wall, rescale it in place.
  // posterTargetPose holds the current (offset, anchor-corrected) pose;
  // applyPoseToPoster re-applies it with the new scale, center fixed.
  if (posterPlaced && posterModel){
    applyPoseToPoster(posterTargetPose);
  }
  if (fromUser){
    DBG.push('size changed -> ' + SIZES[idx].label
      + ' (' + (SIZES[idx].w*100).toFixed(1) + ' x '
      + (SIZES[idx].h*100).toFixed(1) + ' cm)', 'ok');
    toast(SIZES[idx].label.replace(/"/g,'in'));
  }
}

// size button clicks
sizeBtns.forEach(btn => {
  btn.addEventListener('click', ()=> {
    applySize(Number(btn.dataset.size), true);
  });
});

// ---- start WebXR session ----
startBtn.addEventListener('click', async ()=>{
  setStatus('Loading model…');
  introEl.style.display = 'none';
  hudEl.style.display = 'block';
  try { await preloadModel(); }
  catch(e){
    introEl.style.display = 'flex'; hudEl.style.display = 'none';
    document.getElementById('unsupported').style.display = 'block';
    document.getElementById('unsupported').textContent =
      'Failed to load the 3D model (' + MODEL_URL + ').';
    return;
  }
  startAR();
});

async function startAR(){
  initThree();
  applySize(currentSizeIndex, false);  // builds preview at default size
  try {
    xrSession = await navigator.xr.requestSession('immersive-ar', {
      requiredFeatures: ['hit-test'],
      optionalFeatures: ['dom-overlay', 'anchors', 'light-estimation'],
      domOverlay: { root: hudEl }
    });
    DBG.push('immersive-ar session created', 'ok');
  } catch(e){
    DBG.push('ERROR creating AR session: ' + e.message, 'err');
    setStatus('Could not open the AR camera.');
    introEl.style.display = 'flex'; hudEl.style.display = 'none';
    return;
  }

  renderer.xr.setReferenceSpaceType('local');
  await renderer.xr.setSession(xrSession);

  xrRefSpace  = await xrSession.requestReferenceSpace('local');
  viewerSpace = await xrSession.requestReferenceSpace('viewer');
  DBG.push('reference spaces local + viewer OK', 'ok');

  try {
    // Plain hit-test (feature points + planes). An earlier attempt to
    // restrict this to entityTypes:['plane'] made wall detection MUCH
    // slower on plain walls (~36s vs ~13s) — ARCore only returns a plane
    // hit once it has consolidated a whole plane. Feature points show up
    // far sooner, so we keep the unfiltered request.
    hitTestSource = await xrSession.requestHitTestSource({ space: viewerSpace });
    DBG.push('hitTestSource created (space=viewer)', 'ok');
  } catch(e){
    DBG.push('ERROR creating hitTestSource: ' + e.message, 'err');
  }

  // check whether this session granted the anchors feature
  anchorSupported = (xrSession.enabledFeatures
    ? xrSession.enabledFeatures.includes('anchors')
    : true);  // some browsers don't expose enabledFeatures; assume yes
  DBG.push('anchors feature: ' + (anchorSupported ? 'available' : 'NOT available'),
    anchorSupported ? 'ok' : 'warn');

  xrSession.addEventListener('end', onSessionEnd);
  xrSession.addEventListener('select', onSelect);

  DBG.push('VERTICAL_DOT_MIN=' + VERTICAL_DOT_MIN
    + '  (|normal.y| must be < ' + (1 - VERTICAL_DOT_MIN).toFixed(2)
    + ' to count as a wall)');
  DBG.push('loop started — point at the wall and move slowly');
  setStatus('Looking for a wall… move the phone slowly');
  renderer.setAnimationLoop(onXRFrame);
}

function onSessionEnd(){
  renderer.setAnimationLoop(null);
  if (hitTestSource){ hitTestSource.cancel?.(); hitTestSource = null; }
  if (posterAnchor){ posterAnchor.delete?.(); posterAnchor = null; }
  pendingPlacement = null;
  xrSession = null;
  hudEl.style.display = 'none';
  introEl.style.display = 'flex';
  posterPlaced = false;
  resetBtn.classList.add('hidden');
  DBG.push('AR session ended — the log above can still be copied');
}

exitBtn.addEventListener('click', ()=> xrSession && xrSession.end());

resetBtn.addEventListener('click', ()=>{
  if (posterModel){ scene.remove(posterModel); posterModel = null; }
  if (posterAnchor){
    posterAnchor.delete?.();          // release the ARCore anchor
    posterAnchor = null;
  }
  pendingPlacement = null;
  posterPlaced = false;
  reticle.visible = false;
  lastWallPose = null;          // clear smoothing so the next lock snaps clean
  lastWallTime = -1e9;
  resetBtn.classList.add('hidden');
  setStatus('Looking for a wall… move the phone slowly');
  DBG.push('poster removed — tap the wall again to place it');
});

// ---- three.js setup ----
function initThree(){
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.01, 30);

  renderer = new THREE.WebGLRenderer({ alpha:true, antialias:true });
  renderer.setPixelRatio(devicePixelRatio);
  renderer.setSize(innerWidth, innerHeight);
  renderer.xr.enabled = true;
  document.body.appendChild(renderer.domElement);
  renderer.domElement.style.position = 'fixed';
  renderer.domElement.style.inset = '0';
  renderer.domElement.style.zIndex = '10';

  scene.add(new THREE.HemisphereLight(0xffffff, 0x555555, 1.6));
  const dir = new THREE.DirectionalLight(0xffffff, 0.7);
  dir.position.set(0.5, 1, 1);
  scene.add(dir);

  reticle = makeReticle();
  reticle.visible = false;
  reticle.matrixAutoUpdate = false;
  scene.add(reticle);

  sizePreview = makeSizePreview();
  sizePreview.visible = false;
  sizePreview.matrixAutoUpdate = false;
  scene.add(sizePreview);

  addEventListener('resize', ()=>{
    camera.aspect = innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
}

// reticle: ring + dot, lies flat on the wall plane
function makeReticle(){
  const g = new THREE.Group();
  const ring = new THREE.Mesh(
    new THREE.RingGeometry(0.045, 0.055, 40),
    new THREE.MeshBasicMaterial({ color: 0x7CFFB2, side: THREE.DoubleSide,
      transparent:true, opacity:0.95 })
  );
  const dot = new THREE.Mesh(
    new THREE.CircleGeometry(0.006, 20),
    new THREE.MeshBasicMaterial({ color: 0x7CFFB2 })
  );
  g.add(ring, dot);
  return g;
}

// rectangular outline of the currently selected real size
function makeSizePreview(){
  const w = posterSize.width  / 2;
  const h = posterSize.height / 2;
  const pts = [
    new THREE.Vector3(-w,-h,0), new THREE.Vector3( w,-h,0),
    new THREE.Vector3( w, h,0), new THREE.Vector3(-w, h,0),
    new THREE.Vector3(-w,-h,0)
  ];
  const geo = new THREE.BufferGeometry().setFromPoints(pts);
  return new THREE.Line(geo, new THREE.LineBasicMaterial({
    color: 0x7CFFB2, transparent:true, opacity:0.9 }));
}

function refreshSizePreview(){
  if (!sizePreview || !scene) return;
  const wasVisible = sizePreview.visible;
  const prevMatrix = sizePreview.matrix.clone();
  scene.remove(sizePreview);
  sizePreview = makeSizePreview();
  sizePreview.matrixAutoUpdate = false;
  sizePreview.visible = wasVisible;
  sizePreview.matrix.copy(prevMatrix);
  scene.add(sizePreview);
}

// ---- geometry helpers ----
const _m = new THREE.Matrix4();
const UP = new THREE.Vector3(0,1,0);

function surfaceNormalFromPose(matrix){
  const q = new THREE.Quaternion();
  const p = new THREE.Vector3();
  const s = new THREE.Vector3();
  matrix.decompose(p, q, s);
  return new THREE.Vector3(0,1,0).applyQuaternion(q).normalize();
}

function isWall(normal){
  return Math.abs(normal.y) < (1 - VERTICAL_DOT_MIN);
}

// Flush pose ON the wall surface: position = hit point (NO offset here),
// rotation so local +Z faces away from the wall.
// The wall offset is applied exactly once, in offsetPoseFromFlush, at
// placement time. The reticle uses this flush pose directly (a target
// marker sits on the surface); the poster uses the offset pose.
function poseOnWall(hitMatrix){
  const p = new THREE.Vector3();
  const q = new THREE.Quaternion();
  const s = new THREE.Vector3();
  hitMatrix.decompose(p, q, s);
  const n = new THREE.Vector3(0,1,0).applyQuaternion(q).normalize();

  let up = UP.clone();
  if (Math.abs(n.dot(up)) > 0.95) up = new THREE.Vector3(0,0,1);
  const right = new THREE.Vector3().crossVectors(up, n).normalize();
  const realUp = new THREE.Vector3().crossVectors(n, right).normalize();

  const rot = new THREE.Matrix4().makeBasis(right, realUp, n);
  const quat = new THREE.Quaternion().setFromRotationMatrix(rot);

  const out = new THREE.Matrix4();
  out.compose(p, quat, new THREE.Vector3(1,1,1));
  return out;
}

// Build the OFFSET pose: take a flush wall pose and push it WALL_OFFSET
// out along the wall normal. This is computed ONCE, at placement time.
// The offset is never recalculated afterwards — that was the bug that
// made the poster creep/jump forward when the phone moved a lot.
function offsetPoseFromFlush(flushMatrix){
  const pos = new THREE.Vector3();
  const quat = new THREE.Quaternion();
  const scl = new THREE.Vector3();
  flushMatrix.decompose(pos, quat, scl);
  const normal = new THREE.Vector3(0, 0, 1).applyQuaternion(quat).normalize();
  const out = pos.clone().addScaledVector(normal, WALL_OFFSET);
  const m = new THREE.Matrix4();
  m.compose(out, quat, new THREE.Vector3(1,1,1));
  return m;
}

// Apply a pose matrix + the current size scale to the poster.
// poseMatrix is ALREADY the final pose (offset baked in). This function
// only copies position/rotation and sets scale — it does NOT add any
// offset and does NOT recalculate the normal. Scale is applied via
// posterModel.scale (a THREE property) so it composes cleanly with the
// model's internal centering offsets.
function applyPoseToPoster(poseMatrix){
  if (!posterModel) return;
  const f = scaleForSize(currentSizeIndex);
  const pos = new THREE.Vector3();
  const quat = new THREE.Quaternion();
  const scl = new THREE.Vector3();
  poseMatrix.decompose(pos, quat, scl);

  posterModel.matrixAutoUpdate = true;
  posterModel.position.copy(pos);
  posterModel.quaternion.copy(quat);
  posterModel.scale.set(f.x, f.y, f.z);
  posterModel.updateMatrix();
}

// ---- tap to place / move the poster ----
// createAnchor needs an XRFrame, which the 'select' event doesn't carry.
// So onSelect captures the OFFSET pose and onXRFrame creates the anchor.
function onSelect(){
  DBG.push('TAP on screen. reticle.visible=' + reticle.visible);
  if (!reticle.visible) {
    toast('Point at a wall first');
    return;
  }
  if (!posterModel){
    posterModel = modelTemplate.clone(true);
    scene.add(posterModel);
  }
  // reticle.matrix is the FLUSH wall pose. Bake the offset in ONCE here.
  placedPose.copy(reticle.matrix);                 // flush pose (for size logic)
  posterTargetPose.copy(offsetPoseFromFlush(reticle.matrix));  // offset pose

  // the anchor is created at the OFFSET pose, so ARCore tracks the exact
  // point where the poster sits — no offset math happens after this.
  const pos = new THREE.Vector3();
  const quat = new THREE.Quaternion();
  posterTargetPose.decompose(pos, quat, new THREE.Vector3());
  pendingPlacement = {
    position: { x: pos.x, y: pos.y, z: pos.z },
    orientation: { x: quat.x, y: quat.y, z: quat.z, w: quat.w }
  };

  // show the poster immediately (anchor takes over within a frame or two)
  applyPoseToPoster(posterTargetPose);
  posterPlaced = true;
  resetBtn.classList.remove('hidden');
  setStatus('Poster placed — tap elsewhere to move it');
  toast('Poster placed at real size');
  DBG.push('poster PLACED (' + SIZES[currentSizeIndex].label
    + ') offset=' + (WALL_OFFSET*100).toFixed(1) + 'cm baked in'
    + (anchorSupported ? ' — anchoring…' : ' — no anchor API'), 'ok');
}

// ---- render loop ----
let _dbgLastSummary = 0;
let _dbgFrameCount = 0;
let _dbgMaxHits = 0;
let _dbgLastWallState = null;
let _dbgFirstHitLogged = false;
let _dbgFirstWallLogged = false;

// smoothing constants (state vars declared near the top)
const HOLD_MS = 600;            // keep last wall pose this long after a drop
const SMOOTH = 0.35;            // 0..1 — higher = snappier, lower = smoother
// if the anchor pose jumps more than this (m) in one frame, reject it —
// ARCore occasionally glitches in cluttered rooms; we hold the last pose.
const JUMP_LIMIT = 0.25;
const _smPos = new THREE.Vector3();
const _smQuat = new THREE.Quaternion();
const _smScl = new THREE.Vector3();
const _tgPos = new THREE.Vector3();
const _tgQuat = new THREE.Quaternion();

function onXRFrame(timestamp, frame){
  if (!frame) return;
  if (!hitTestSource){ renderer.render(scene, camera); return; }

  // ---- anchor: create one if a placement is pending ----
  if (pendingPlacement && anchorSupported && frame.createAnchor){
    const xform = new XRRigidTransform(
      pendingPlacement.position, pendingPlacement.orientation);
    const pend = pendingPlacement;
    pendingPlacement = null;            // consume it (avoid double-create)
    frame.createAnchor(xform, xrRefSpace).then(anchor => {
      posterAnchor = anchor;
      DBG.push('anchor created — poster locked to ARCore map', 'ok');
    }).catch(err => {
      DBG.push('anchor failed (' + (err && err.message || err)
        + ') — using fixed pose', 'warn');
    });
  } else if (pendingPlacement && !anchorSupported){
    pendingPlacement = null;            // no anchor API: keep the fixed pose
  }

  // ---- anchor: each frame, follow the ARCore-corrected pose ----
  // The anchor was created at the OFFSET pose, so its pose IS already the
  // poster's final pose. We copy it straight in — no normal recalculation,
  // no offset re-addition. That double-application was what made the
  // poster creep/jump forward when the phone moved. We also reject wild
  // jumps: if the anchor pose leaps more than JUMP_LIMIT in one frame,
  // we keep the previous pose (ARCore occasionally glitches in busy rooms).
  if (posterAnchor && posterModel){
    const aPose = frame.getPose(posterAnchor.anchorSpace, xrRefSpace);
    if (aPose){
      const m = new THREE.Matrix4().fromArray(aPose.transform.matrix);
      const newPos = new THREE.Vector3();
      m.decompose(newPos, new THREE.Quaternion(), new THREE.Vector3());
      const prevPos = new THREE.Vector3();
      posterTargetPose.decompose(prevPos, new THREE.Quaternion(), new THREE.Vector3());
      const jump = newPos.distanceTo(prevPos);
      if (jump < JUMP_LIMIT){
        posterTargetPose.copy(m);     // accept the corrected pose
        applyPoseToPoster(m);
      } else {
        // anchor glitched — keep the last good pose, log it
        DBG.push('anchor jump ' + (jump*100).toFixed(0)
          + 'cm rejected — holding last pose', 'warn');
      }
    }
  }

  const results = frame.getHitTestResults(hitTestSource);
  _dbgFrameCount++;
  if (results.length > _dbgMaxHits) _dbgMaxHits = results.length;

  if (!_dbgFirstHitLogged && results.length > 0){
    _dbgFirstHitLogged = true;
    DBG.push('first hit-test received (' + results.length + ' result(s))', 'ok');
  }

  let wallHit = null;
  let normalsInfo = [];
  for (const r of results){
    const pose = r.getPose(xrRefSpace);
    if (!pose) continue;
    _m.fromArray(pose.transform.matrix);
    const n = surfaceNormalFromPose(_m.clone());
    normalsInfo.push({ x:n.x, y:n.y, z:n.z, wall: isWall(n) });
    if (isWall(n) && !wallHit){ wallHit = _m.clone(); }
  }

  if (!_dbgFirstWallLogged && wallHit){
    _dbgFirstWallLogged = true;
    DBG.push('first valid WALL detected', 'ok');
  }

  const curState = wallHit ? 'wall' : (results.length > 0 ? 'nonwall' : 'none');
  if (curState !== _dbgLastWallState){
    if (curState === 'wall'){
      DBG.push('-> WALL found (reticle ON)', 'ok');
    } else if (curState === 'nonwall'){
      const n = normalsInfo[0];
      DBG.push('-> surface detected but NOT a wall. '
        + 'normal=(' + n.x.toFixed(2) + ',' + n.y.toFixed(2) + ',' + n.z.toFixed(2)
        + ') |y|=' + Math.abs(n.y).toFixed(2)
        + ' (limit ' + (1 - VERTICAL_DOT_MIN).toFixed(2) + ')', 'warn');
    } else {
      DBG.push('-> no hit-test at all (lost tracking / pointing at empty space)', 'warn');
    }
    _dbgLastWallState = curState;
  }

  if (timestamp - _dbgLastSummary > 1000){
    let line = 'fps~' + _dbgFrameCount
      + ' | hits now=' + results.length
      + ' | max hits=' + _dbgMaxHits;
    if (normalsInfo.length){
      const n = normalsInfo[0];
      line += ' | normal[0]=(' + n.x.toFixed(2) + ','
        + n.y.toFixed(2) + ',' + n.z.toFixed(2) + ')'
        + (n.wall ? ' WALL' : ' non-wall');
    }
    DBG.push(line);
    _dbgLastSummary = timestamp;
    _dbgFrameCount = 0;
  }

  // ---- decide the reticle pose with smoothing + hold ----
  let showReticle = false;
  let activePose = null;

  if (wallHit){
    // real wall this frame -> compute pose, remember it
    const wallPose = poseOnWall(wallHit);
    lastWallTime = timestamp;
    if (!lastWallPose){
      lastWallPose = wallPose.clone();      // first lock: snap
    } else {
      // lerp the stored pose toward the new one (glide, no jump)
      lastWallPose.decompose(_smPos, _smQuat, _smScl);
      wallPose.decompose(_tgPos, _tgQuat, new THREE.Vector3());
      _smPos.lerp(_tgPos, SMOOTH);
      _smQuat.slerp(_tgQuat, SMOOTH);
      lastWallPose.compose(_smPos, _smQuat, new THREE.Vector3(1,1,1));
    }
    showReticle = true;
    activePose = lastWallPose;
  } else if (lastWallPose && (timestamp - lastWallTime) < HOLD_MS){
    // no wall this frame, but we had one very recently -> hold it
    showReticle = true;
    activePose = lastWallPose;
  } else {
    // genuinely lost -> drop the reticle and forget the stale pose
    showReticle = false;
    if (timestamp - lastWallTime >= HOLD_MS) lastWallPose = null;
  }

  if (showReticle && activePose){
    reticle.visible = true;
    reticle.matrix.copy(activePose);
    if (!posterPlaced){
      sizePreview.visible = true;
      sizePreview.matrix.copy(activePose);
      setStatus('Wall found — tap to place the poster');
    } else {
      sizePreview.visible = false;
    }
  } else {
    reticle.visible = false;
    sizePreview.visible = false;
    if (!posterPlaced && results.length > 0){
      setStatus('Detected surface is not vertical — point at the wall');
    } else if (!posterPlaced){
      setStatus('Looking for a wall… move the phone slowly');
    }
  }

  renderer.render(scene, camera);
}
</script>
</body>
