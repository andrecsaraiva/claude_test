<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>AR Try-On — Parede</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: #0d0d0f; font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; color: #fff; overflow: hidden; }

  /* ---- Tela inicial / status ---- */
  #intro {
    position: fixed; inset: 0; z-index: 30;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 32px; gap: 18px;
    background: radial-gradient(circle at 50% 30%, #1c1c22, #0d0d0f);
  }
  #intro h1 { font-size: 22px; font-weight: 650; }
  #intro p { font-size: 14px; line-height: 1.5; color: #a8a8b0; max-width: 320px; }
  #startBtn {
    margin-top: 8px; padding: 15px 34px; font-size: 16px; font-weight: 600;
    border: none; border-radius: 100px; background: #f5f3ee; color: #16161a;
    cursor: pointer;
  }
  #startBtn:active { transform: scale(0.97); }
  #unsupported { display: none; color: #ff8a80; font-size: 13px; max-width: 320px; }

  /* ---- HUD durante o AR (dom-overlay) ---- */
  #hud { position: fixed; inset: 0; z-index: 20; display: none; pointer-events: none; }
  #status {
    position: absolute; top: env(safe-area-inset-top, 14px); left: 50%;
    transform: translateX(-50%); margin-top: 14px;
    background: rgba(0,0,0,0.62); backdrop-filter: blur(8px);
    padding: 9px 18px; border-radius: 100px; font-size: 13px; white-space: nowrap;
  }
  #bottomBar {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 16px 16px calc(env(safe-area-inset-bottom, 16px) + 16px);
    display: flex; gap: 10px; justify-content: center; pointer-events: auto;
  }
  .pill {
    padding: 13px 20px; font-size: 14px; font-weight: 600; border-radius: 100px;
    border: 1px solid rgba(255,255,255,0.18); background: rgba(20,20,24,0.78);
    backdrop-filter: blur(8px); color: #fff; cursor: pointer;
  }
  .pill:active { transform: scale(0.96); }
  .pill.hidden { display: none; }
  #exitBtn {
    position: absolute; top: env(safe-area-inset-top, 14px); right: 14px; margin-top: 14px;
    width: 38px; height: 38px; border-radius: 50%; pointer-events: auto;
    background: rgba(0,0,0,0.62); border: none; color: #fff; font-size: 18px; cursor: pointer;
  }
  #toast {
    position: absolute; bottom: 96px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.8); padding: 8px 16px; border-radius: 100px;
    font-size: 12px; opacity: 0; transition: opacity .25s; white-space: nowrap;
  }

  /* ===== size picker (estilo AllPosters) ===== */
  #sizeBar {
    position: absolute; left: 0; right: 0;
    bottom: calc(env(safe-area-inset-bottom, 16px) + 70px);
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    pointer-events: none;
  }
  #sizeLabel {
    font-size: 12px; font-weight: 600; color: #fff;
    text-shadow: 0 1px 3px rgba(0,0,0,0.9); letter-spacing: 0.3px;
  }
  #sizeBtns { display: flex; gap: 8px; pointer-events: auto; }
  .size-btn {
    min-width: 78px; padding: 11px 10px;
    font-size: 13px; font-weight: 600; text-align: center;
    background: #ffffff; color: #1a1a1a;
    border: 1px solid #cfcfcf; border-radius: 4px; cursor: pointer;
    transition: background .12s, color .12s, border-color .12s;
  }
  .size-btn:active { transform: scale(0.97); }
  .size-btn.active {
    background: #29c5e8; color: #ffffff; border-color: #29c5e8;
  }

  /* ===== painel de debug ===== */
  #debugPanel {
    position: absolute; left: 8px; right: 8px;
    top: calc(env(safe-area-inset-top, 14px) + 60px);
    height: 40vh; display: flex; flex-direction: column;
    background: rgba(0,0,0,0.82); border: 1px solid rgba(124,255,178,0.4);
    border-radius: 10px; pointer-events: auto; overflow: hidden;
  }
  #debugLog {
    flex: 1; overflow-y: auto; padding: 8px 10px;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 10px; line-height: 1.45; color: #b9f5cf;
    white-space: pre-wrap; word-break: break-word;
  }
  #debugLog .warn { color: #ffd27c; }
  #debugLog .err  { color: #ff8a80; }
  #debugLog .ok   { color: #7CFFB2; }
  #debugBtns { display: flex; border-top: 1px solid rgba(255,255,255,0.12); }
  .dbg {
    flex: 1; padding: 10px 4px; font-size: 12px; font-weight: 600;
    background: rgba(20,20,24,0.9); color: #fff; border: none;
    border-right: 1px solid rgba(255,255,255,0.1); cursor: pointer;
  }
  .dbg:last-child { border-right: none; }
  .dbg:active { background: rgba(124,255,178,0.2); }
  #showLogBtn {
    position: absolute; left: 14px;
    top: calc(env(safe-area-inset-top, 14px) + 14px);
    padding: 7px 12px; font-size: 11px; font-weight: 700; letter-spacing: 0.5px;
    background: rgba(0,0,0,0.62); border: 1px solid rgba(124,255,178,0.5);
    color: #7CFFB2; border-radius: 8px; pointer-events: auto; cursor: pointer;
  }
  #debugPanel.hidden, #showLogBtn.hidden { display: none; }
</style>
</head>
<body>

<div id="intro">
  <h1>Try-On de Parede</h1>
  <p>Aponte a câmera para a <b>parede</b> onde quer ver o quadro. Mova o celular devagar para o AR reconhecer a superfície, depois toque para fixar.</p>
  <button id="startBtn">Iniciar câmera</button>
  <p id="unsupported">⚠️ Este aparelho/navegador não suporta WebXR AR.<br>Use o <b>Google Chrome</b> num Android com ARCore.</p>
</div>

<div id="hud">
  <div id="status">Iniciando…</div>
  <button id="exitBtn">✕</button>
  <div id="toast"></div>

  <!-- ===== painel de DEBUG (oculto — motor DBG continua rodando) ===== -->
  <div id="debugPanel" class="hidden">
    <div id="debugLog"></div>
    <div id="debugBtns">
      <button class="dbg" id="copyLogBtn">Copiar log</button>
      <button class="dbg" id="clearLogBtn">Limpar</button>
      <button class="dbg" id="hideLogBtn">Ocultar</button>
    </div>
  </div>
  <button id="showLogBtn" class="hidden">LOG</button>

  <!-- ===== size picker ===== -->
  <div id="sizeBar">
    <div id="sizeLabel">Choose size</div>
    <div id="sizeBtns">
      <button class="size-btn" data-size="0">13" × 19"</button>
      <button class="size-btn" data-size="1">15" × 22"</button>
      <button class="size-btn active" data-size="2">22" × 34"</button>
    </div>
  </div>

  <div id="bottomBar">
    <button class="pill hidden" id="resetBtn">Reposicionar</button>
  </div>
</div>

<!-- three.js + loaders via CDN (modulos ES) -->
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// ===================== CONFIG =====================
// URL do GLB do quadro. Pode ser qualquer GLB: o codigo mede e adapta
// orientacao/origem automaticamente. Veja MODEL_* abaixo p/ ajustes.
const MODEL_URL  = './poster.glb';

// --- Escala ---
// Multiplicador aplicado ao GLB.
// IMPORTANTE: o exportador glTF do Blender SEMPRE grava em metros, mesmo
// que a Unit da cena esteja em cm. Este GLB ja veio em metros
// (bbox medido = 0.56 x 0.86 m), portanto a escala correta e 1.0.
// Use 0.01 apenas se algum dia um GLB vier realmente em centimetros.
const MODEL_SCALE = 1.0;

// --- Tamanho real forcado (opcional) ---
// Se quiser que o quadro tenha um tamanho fisico exato independente do GLB,
// preencha em METROS. Deixe null para usar o tamanho nativo do modelo.
// O GLB enviado ja mede 0.56 x 0.86 m, entao null = tamanho correto.
//   ex.: { width: 0.56, height: 0.86 }
const MODEL_REAL_SIZE = null;

// Auto-recentrar a origem do modelo no centro do bounding box.
// Resolve GLBs exportados com a origem num canto. Quase sempre true.
// (Neste GLB a origem ja esta no centro, mas manter true nao atrapalha.)
const MODEL_AUTOCENTER = true;

// --- Tamanhos do poster (3 botoes) ---
// Tamanhos em polegadas convertidos p/ metros (1in = 0.0254 m).
// O botao 3 (22x34) corresponde ao tamanho nativo do GLB.
const SIZES = [
  { label: '13" x 19"', w: 13 * 0.0254, h: 19 * 0.0254 },
  { label: '15" x 22"', w: 15 * 0.0254, h: 22 * 0.0254 },
  { label: '22" x 34"', w: 22 * 0.0254, h: 34 * 0.0254 }
];
let currentSizeIndex = 2;   // padrao = botao 3

// --- Tracking ---
const WALL_OFFSET = 0.012;   // distancia (m) do quadro p/ fora da parede (evita z-fighting)
// Quao "vertical" um plano precisa ser p/ contar como parede.
// 1 = perfeitamente vertical. 0.82 ~= ate ~35 graus de inclinacao tolerada.
const VERTICAL_DOT_MIN = 0.82;
// ==================================================

const statusEl = document.getElementById('status');
const introEl  = document.getElementById('intro');
const hudEl    = document.getElementById('hud');
const toastEl  = document.getElementById('toast');
const startBtn = document.getElementById('startBtn');
const exitBtn  = document.getElementById('exitBtn');
const resetBtn = document.getElementById('resetBtn');

// ===== motor de DEBUG =====
const debugPanel = document.getElementById('debugPanel');
const debugLogEl = document.getElementById('debugLog');
const DBG = {
  lines: [],
  max: 400,
  t0: performance.now(),
  push(msg, cls){
    const t = ((performance.now() - this.t0) / 1000).toFixed(2);
    const entry = '[' + t + 's] ' + msg;
    this.lines.push({ text: entry, cls: cls || '' });
    if (this.lines.length > this.max) this.lines.shift();
    this.render();
  },
  render(){
    if (!debugLogEl) return;
    debugLogEl.innerHTML = this.lines
      .map(l => l.cls ? '<span class="'+l.cls+'">'+esc(l.text)+'</span>' : esc(l.text))
      .join('\n');
    debugLogEl.scrollTop = debugLogEl.scrollHeight;
  },
  text(){ return this.lines.map(l => l.text).join('\n'); }
};
function esc(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// botoes do painel
document.getElementById('showLogBtn').addEventListener('click', ()=>{
  debugPanel.classList.remove('hidden');
  document.getElementById('showLogBtn').classList.add('hidden');
});
document.getElementById('hideLogBtn').addEventListener('click', ()=>{
  debugPanel.classList.add('hidden');
  document.getElementById('showLogBtn').classList.remove('hidden');
});
document.getElementById('clearLogBtn').addEventListener('click', ()=>{
  DBG.lines = []; DBG.render();
});
document.getElementById('copyLogBtn').addEventListener('click', async ()=>{
  const txt = DBG.text();
  try {
    await navigator.clipboard.writeText(txt);
    toast('Log copiado — cole no chat');
  } catch(e){
    // fallback: seleciona o texto p/ copia manual
    const ta = document.createElement('textarea');
    ta.value = txt; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast('Log copiado'); }
    catch(e2){ toast('Copie manualmente do painel'); }
    document.body.removeChild(ta);
  }
});

let renderer, scene, camera;
let reticle, sizePreview, posterModel, posterPlaced = false;
let posterInner = null;        // o GLB clonado, dentro do wrapper posterModel
let xrSession = null, xrRefSpace = null, viewerSpace = null;
let hitTestSource = null;
let modelTemplate = null;     // GLB carregado, clonado ao fixar
let toastTimer = null;

// tamanho NATIVO do GLB (m), medido em normalizeModel. Os botoes de
// tamanho escalam o modelo a partir deste valor.
let nativeSize = { width: 0.6, height: 0.9, depth: 0.02 };

// guard de toque na UI: tocar num botao do overlay tambem dispara o
// evento 'select' do WebXR. markUITap() abre uma janela curta na qual
// o onSelect ignora o select — assim mudar de tamanho nunca reposiciona.
let uiTapUntil = 0;
function markUITap(){ uiTapUntil = performance.now() + 400; }

function setStatus(t){ statusEl.textContent = t; }
function toast(t){
  toastEl.textContent = t; toastEl.style.opacity = 1;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ toastEl.style.opacity = 0; }, 2200);
}

// ---- checagem de suporte ----
async function checkSupport(){
  if (!('xr' in navigator)) return false;
  try { return await navigator.xr.isSessionSupported('immersive-ar'); }
  catch(e){ return false; }
}

checkSupport().then(ok => {
  DBG.push('=== AR Try-On debug ===');
  DBG.push('UA: ' + navigator.userAgent);
  DBG.push('WebXR immersive-ar suportado: ' + ok, ok ? 'ok' : 'err');
  DBG.push('tela: ' + innerWidth + 'x' + innerHeight + ' dpr=' + devicePixelRatio);
  if (!ok){
    startBtn.style.display = 'none';
    document.getElementById('unsupported').style.display = 'block';
  }
});

// dimensoes finais do quadro (m), preenchidas apos normalizar o GLB
let posterSize = { width: 0.6, height: 0.9, depth: 0.02 };

// ---- carrega o GLB e o NORMALIZA para a convencao da parede ----
// Convencao alvo: quadro no plano XY, face frontal apontando para +Z,
// origem no centro, escala em metros.
// O codigo detecta sozinho o eixo "fino" (profundidade) do quadro e o
// rotaciona para +Z, recentra a origem e aplica escala. Funciona com
// GLBs exportados em qualquer orientacao (Blender, etc.).
function preloadModel(){
  DBG.push('carregando GLB: ' + MODEL_URL);
  return new Promise((resolve, reject)=>{
    new GLTFLoader().load(MODEL_URL,
      gltf => {
        try {
          modelTemplate = normalizeModel(gltf.scene);
          DBG.push('GLB OK -> quadro ' + posterSize.width.toFixed(3) + ' x '
            + posterSize.height.toFixed(3) + ' x ' + posterSize.depth.toFixed(4)
            + ' m', 'ok');
          resolve();
        } catch(e){
          DBG.push('ERRO ao normalizar GLB: ' + e.message, 'err');
          reject(e);
        }
      },
      undefined,
      err => {
        DBG.push('ERRO ao carregar GLB: ' + (err && err.message || err), 'err');
        reject(err);
      }
    );
  });
}

function normalizeModel(root){
  // 1) mede o bounding box bruto do GLB
  let box = new THREE.Box3().setFromObject(root);
  let size = new THREE.Vector3(); box.getSize(size);
  let center = new THREE.Vector3(); box.getCenter(center);

  // 2) detecta o eixo "fino" -> e a profundidade do quadro
  const dims = [size.x, size.y, size.z];
  const thinAxis = dims.indexOf(Math.min(...dims)); // 0=x, 1=y, 2=z

  // 3) wrapper que recentra a origem no centro do bbox
  const centered = new THREE.Group();
  if (MODEL_AUTOCENTER) root.position.sub(center);
  centered.add(root);

  // 4) rotaciona para que o eixo fino vire +Z (profundidade -> frente)
  if (thinAxis === 0)       centered.rotation.y =  Math.PI / 2;  // X fino -> Z
  else if (thinAxis === 1)  centered.rotation.x = -Math.PI / 2;  // Y fino -> Z
  // thinAxis === 2: ja esta com a profundidade em Z, nada a fazer

  // 5) aplica escala (cm->m etc.) e mede de novo ja orientado
  const scaled = new THREE.Group();
  centered.scale.setScalar(MODEL_SCALE);
  scaled.add(centered);

  let box2 = new THREE.Box3().setFromObject(scaled);
  let size2 = new THREE.Vector3(); box2.getSize(size2);
  // agora size2.x = largura, size2.y = altura, size2.z = profundidade

  // 6) tamanho real forcado (opcional): reescala XY p/ medidas exatas
  if (MODEL_REAL_SIZE && size2.x > 0 && size2.y > 0){
    const fx = MODEL_REAL_SIZE.width  / size2.x;
    const fy = MODEL_REAL_SIZE.height / size2.y;
    // escala uniforme media p/ nao distorcer; XY dominam o resultado
    centered.scale.multiplyScalar((fx + fy) / 2);
    box2 = new THREE.Box3().setFromObject(scaled);
    box2.getSize(size2);
  }

  posterSize = { width: size2.x, height: size2.y, depth: size2.z };
  nativeSize = { width: size2.x, height: size2.y, depth: size2.z };
  console.log('[AR] quadro normalizado (m):', posterSize,
              ' eixo fino detectado:', ['X','Y','Z'][thinAxis]);
  return scaled;
}

// ---- inicia a sessao WebXR ----
startBtn.addEventListener('click', async ()=>{
  setStatus('Carregando modelo…');
  introEl.style.display = 'none';
  hudEl.style.display = 'block';
  try { await preloadModel(); }
  catch(e){
    introEl.style.display = 'flex'; hudEl.style.display = 'none';
    document.getElementById('unsupported').style.display = 'block';
    document.getElementById('unsupported').textContent = 'Falha ao carregar o modelo 3D (' + MODEL_URL + ').';
    return;
  }
  startAR();
});

async function startAR(){
  initThree();
  // aplica o tamanho padrao (botao 3) — atualiza posterSize + preview
  selectSize(currentSizeIndex);
  try {
    xrSession = await navigator.xr.requestSession('immersive-ar', {
      requiredFeatures: ['hit-test'],
      optionalFeatures: ['dom-overlay', 'anchors', 'light-estimation'],
      domOverlay: { root: hudEl }
    });
    DBG.push('sessao immersive-ar criada', 'ok');
  } catch(e){
    DBG.push('ERRO ao criar sessao AR: ' + e.message, 'err');
    setStatus('Não foi possível abrir a câmera AR.');
    introEl.style.display = 'flex'; hudEl.style.display = 'none';
    return;
  }

  renderer.xr.setReferenceSpaceType('local');
  await renderer.xr.setSession(xrSession);

  xrRefSpace  = await xrSession.requestReferenceSpace('local');
  viewerSpace = await xrSession.requestReferenceSpace('viewer');
  DBG.push('reference spaces local + viewer OK', 'ok');

  // hit-test a partir do "viewer" = centro da tela. Pegamos resultados
  // ao vivo a cada frame e filtramos os que apontam para parede.
  try {
    hitTestSource = await xrSession.requestHitTestSource({ space: viewerSpace });
    DBG.push('hitTestSource criado (espaco=viewer)', 'ok');
  } catch(e){
    DBG.push('ERRO ao criar hitTestSource: ' + e.message, 'err');
  }

  xrSession.addEventListener('end', onSessionEnd);
  xrSession.addEventListener('select', onSelect);   // toque na tela

  DBG.push('VERTICAL_DOT_MIN=' + VERTICAL_DOT_MIN
    + '  (|normal.y| precisa ser < ' + (1 - VERTICAL_DOT_MIN).toFixed(2)
    + ' p/ contar como parede)');
  DBG.push('loop iniciado — aponte p/ a parede e mova devagar');
  setStatus('Procurando parede… mova o celular devagar');
  renderer.setAnimationLoop(onXRFrame);
}

function onSessionEnd(){
  renderer.setAnimationLoop(null);
  if (hitTestSource){ hitTestSource.cancel?.(); hitTestSource = null; }
  xrSession = null;
  hudEl.style.display = 'none';
  introEl.style.display = 'flex';
  posterPlaced = false;
  resetBtn.classList.add('hidden');
  DBG.push('sessao AR encerrada — o log acima pode ser copiado');
}

exitBtn.addEventListener('pointerdown', markUITap);
exitBtn.addEventListener('click', ()=> xrSession && xrSession.end());

resetBtn.addEventListener('pointerdown', markUITap);
resetBtn.addEventListener('click', ()=>{
  markUITap();
  if (posterModel){ scene.remove(posterModel); posterModel = null; }
  posterInner = null;
  posterPlaced = false;
  reticle.visible = false;
  resetBtn.classList.add('hidden');
  setStatus('Procurando parede… mova o celular devagar');
});

// ---- botoes de tamanho ----
// Aplicam o tamanho escolhido. Se o quadro JA esta fixado, escalam o
// modelo interno NO LUGAR (sem mexer na pose congelada do wrapper). Se
// ainda nao foi fixado, so atualizam o contorno de preview.
const sizeBtns = Array.from(document.querySelectorAll('.size-btn'));
function selectSize(idx){
  currentSizeIndex = idx;
  sizeBtns.forEach(b => b.classList.toggle('active', Number(b.dataset.size) === idx));
  // atualiza posterSize p/ o contorno de preview refletir o tamanho
  posterSize = {
    width: SIZES[idx].w,
    height: SIZES[idx].h,
    depth: nativeSize.depth
  };
  refreshSizePreview();
  // se o quadro ja esta na parede, so reescala o modelo interno
  if (posterPlaced && posterInner){
    applySizeToInner(idx);
  }
  toast(SIZES[idx].label);
  DBG.push('tamanho -> ' + SIZES[idx].label, 'ok');
}
sizeBtns.forEach(btn => {
  btn.addEventListener('pointerdown', markUITap);
  btn.addEventListener('click', ()=>{
    markUITap();
    selectSize(Number(btn.dataset.size));
  });
});

// ---- three.js setup ----
function initThree(){
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.01, 30);

  renderer = new THREE.WebGLRenderer({ alpha:true, antialias:true });
  renderer.setPixelRatio(devicePixelRatio);
  renderer.setSize(innerWidth, innerHeight);
  renderer.xr.enabled = true;
  document.body.appendChild(renderer.domElement);
  renderer.domElement.style.position = 'fixed';
  renderer.domElement.style.inset = '0';
  renderer.domElement.style.zIndex = '10';

  // luz: ambiente + direcional. (light-estimation pode refinar depois.)
  scene.add(new THREE.HemisphereLight(0xffffff, 0x555555, 1.6));
  const dir = new THREE.DirectionalLight(0xffffff, 0.7);
  dir.position.set(0.5, 1, 1);
  scene.add(dir);

  // ---- reticle: mira que gruda na parede ----
  reticle = makeReticle();
  reticle.visible = false;
  reticle.matrixAutoUpdate = false;
  scene.add(reticle);

  // contorno em tamanho real do quadro (preview na parede antes de fixar)
  sizePreview = makeSizePreview();
  sizePreview.visible = false;
  sizePreview.matrixAutoUpdate = false;
  scene.add(sizePreview);

  addEventListener('resize', ()=>{
    camera.aspect = innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
}

// mira em anel + cruz, deitada no plano da parede
function makeReticle(){
  const g = new THREE.Group();
  const ring = new THREE.Mesh(
    new THREE.RingGeometry(0.045, 0.055, 40),
    new THREE.MeshBasicMaterial({ color: 0x7CFFB2, side: THREE.DoubleSide,
      transparent:true, opacity:0.95 })
  );
  const dot = new THREE.Mesh(
    new THREE.CircleGeometry(0.006, 20),
    new THREE.MeshBasicMaterial({ color: 0x7CFFB2 })
  );
  g.add(ring, dot);
  return g;
}

// contorno retangular do tamanho real do quadro (preview antes de fixar)
function makeSizePreview(){
  const w = posterSize.width  / 2;
  const h = posterSize.height / 2;
  const pts = [
    new THREE.Vector3(-w,-h,0), new THREE.Vector3( w,-h,0),
    new THREE.Vector3( w, h,0), new THREE.Vector3(-w, h,0),
    new THREE.Vector3(-w,-h,0)
  ];
  const geo = new THREE.BufferGeometry().setFromPoints(pts);
  const line = new THREE.Line(geo, new THREE.LineBasicMaterial({
    color: 0x7CFFB2, transparent:true, opacity:0.9 }));
  return line;
}

// recria o preview quando ja sabemos o tamanho real do GLB
function refreshSizePreview(){
  if (!sizePreview) return;
  scene.remove(sizePreview);
  sizePreview = makeSizePreview();
  sizePreview.visible = false;
  sizePreview.matrixAutoUpdate = false;
  scene.add(sizePreview);
}

// ---- helpers de geometria ----
const _m = new THREE.Matrix4();
const _q = new THREE.Quaternion();
const _p = new THREE.Vector3();
const _s = new THREE.Vector3();
const _normal = new THREE.Vector3();
const UP = new THREE.Vector3(0,1,0);

/**
 * Dado o pose de um hit-test, extrai a normal da superficie.
 * No WebXR a orientacao do hit-test result tem o +Y na normal do plano.
 * Retorna a normal (vetor NOVO) em world-space.
 */
function surfaceNormalFromPose(matrix){
  const q = new THREE.Quaternion();
  const p = new THREE.Vector3();
  const s = new THREE.Vector3();
  matrix.decompose(p, q, s);
  return new THREE.Vector3(0,1,0).applyQuaternion(q).normalize();
}

/** true se a superficie for aproximadamente vertical (parede). */
function isWall(normal){
  // parede => normal quase horizontal => componente Y pequeno
  return Math.abs(normal.y) < (1 - VERTICAL_DOT_MIN);
}

/**
 * Constroi a matriz de pose do quadro: posicao no ponto do hit,
 * empurrada WALL_OFFSET para fora da parede, e rotacionada para que
 * a FRENTE do quadro (+Z local) aponte para fora da parede.
 */
function poseOnWall(hitMatrix){
  hitMatrix.decompose(_p, _q, _s);
  const n = new THREE.Vector3(0,1,0).applyQuaternion(_q).normalize(); // normal da parede

  // posicao = ponto do hit + offset ao longo da normal
  const pos = _p.clone().addScaledVector(n, WALL_OFFSET);

  // queremos o +Z do quadro alinhado com a normal n.
  // construimos uma base ortonormal: right, up, forward(=n)
  let up = UP.clone();
  if (Math.abs(n.dot(up)) > 0.95) up = new THREE.Vector3(0,0,1); // fallback
  const right = new THREE.Vector3().crossVectors(up, n).normalize();
  const realUp = new THREE.Vector3().crossVectors(n, right).normalize();

  const rot = new THREE.Matrix4().makeBasis(right, realUp, n);
  const quat = new THREE.Quaternion().setFromRotationMatrix(rot);

  const out = new THREE.Matrix4();
  out.compose(pos, quat, new THREE.Vector3(1,1,1));
  return out;
}

// ---- toque para fixar / mover o quadro ----
const _placeMat = new THREE.Matrix4();
const _offMat = new THREE.Matrix4();
function onSelect(){
  // ignora toques que sao na verdade cliques em botoes da UI
  if (performance.now() < uiTapUntil){
    DBG.push('select ignorado — foi toque em botao da UI');
    return;
  }
  DBG.push('TOQUE na tela. reticle.visible=' + reticle.visible);
  if (!reticle.visible) {
    toast('Aponte para uma parede primeiro');
    return;
  }
  if (!posterModel){
    // posterModel = wrapper EXTERNO que carrega a pose congelada da parede
    // (exatamente como na V1). O modelo GLB vai DENTRO dele (posterInner),
    // e e o posterInner que recebe a escala dos botoes de tamanho.
    // Assim a matriz congelada do wrapper NUNCA e tocada ao mudar tamanho
    // -> o tracking continua identico ao da V1.
    posterModel = new THREE.Group();
    posterInner = modelTemplate.clone(true);
    posterModel.add(posterInner);
    scene.add(posterModel);
    applySizeToInner(currentSizeIndex);   // aplica o tamanho atual
  }
  posterModel.matrixAutoUpdate = false;
  // reticle.matrix esta rente a parede. O quadro tem espessura, entao
  // empurramos +Z local por (metade da profundidade) para que a face
  // de TRAS encoste na parede em vez do centro do quadro.
  _offMat.makeTranslation(0, 0, posterSize.depth / 2);
  _placeMat.copy(reticle.matrix).multiply(_offMat);
  posterModel.matrix.copy(_placeMat);
  posterPlaced = true;
  resetBtn.classList.remove('hidden');
  setStatus('Quadro fixado — toque em outro ponto para mover');
  toast('Quadro posicionado em escala real');
  DBG.push('quadro FIXADO na parede', 'ok');
}

// Aplica o tamanho selecionado SO no modelo interno (escala X e Y a partir
// do centro). Nunca toca na matriz congelada do wrapper -> nao move o
// quadro, so muda o tamanho no lugar.
function applySizeToInner(idx){
  if (!posterInner) return;
  const s = SIZES[idx];
  // fatores relativos ao tamanho nativo do GLB (medido em normalizeModel)
  const fx = s.w / nativeSize.width;
  const fy = s.h / nativeSize.height;
  // origem do modelo esta no centro -> escalar X/Y escala a partir do centro
  posterInner.scale.set(fx, fy, 1);
}

// ---- loop de render ----
// estado p/ throttle e deteccao de transicao
let _dbgLastSummary = 0;
let _dbgFrameCount = 0;
let _dbgMaxHits = 0;
let _dbgWallSeen = false;          // ja vimos parede nesta "fase"?
let _dbgLastWallState = null;      // 'wall' | 'nonwall' | 'none'
let _dbgFirstHitLogged = false;
let _dbgFirstWallLogged = false;

function onXRFrame(timestamp, frame){
  if (!frame) return;
  if (!hitTestSource){ renderer.render(scene, camera); return; }

  const results = frame.getHitTestResults(hitTestSource);
  _dbgFrameCount++;
  if (results.length > _dbgMaxHits) _dbgMaxHits = results.length;

  // primeiro hit-test de toda a sessao
  if (!_dbgFirstHitLogged && results.length > 0){
    _dbgFirstHitLogged = true;
    DBG.push('1o hit-test recebido (' + results.length + ' resultado(s))', 'ok');
  }

  // examina os hits e separa parede de nao-parede; guarda as normais
  let wallHit = null;
  let normalsInfo = [];
  for (const r of results){
    const pose = r.getPose(xrRefSpace);
    if (!pose) continue;
    _m.fromArray(pose.transform.matrix);
    const n = surfaceNormalFromPose(_m.clone());
    normalsInfo.push({ x:n.x, y:n.y, z:n.z, wall: isWall(n) });
    if (isWall(n) && !wallHit){ wallHit = _m.clone(); }
  }

  // log imediato no 1o hit que e parede
  if (!_dbgFirstWallLogged && wallHit){
    _dbgFirstWallLogged = true;
    DBG.push('1a PAREDE valida detectada', 'ok');
  }

  // deteccao de transicao de estado (log imediato, sem throttle)
  const curState = wallHit ? 'wall' : (results.length > 0 ? 'nonwall' : 'none');
  if (curState !== _dbgLastWallState){
    if (curState === 'wall'){
      DBG.push('-> PAREDE encontrada (reticle ON)', 'ok');
    } else if (curState === 'nonwall'){
      const n = normalsInfo[0];
      DBG.push('-> superficie detectada mas NAO e parede. '
        + 'normal=(' + n.x.toFixed(2) + ',' + n.y.toFixed(2) + ',' + n.z.toFixed(2)
        + ') |y|=' + Math.abs(n.y).toFixed(2)
        + ' (limite ' + (1 - VERTICAL_DOT_MIN).toFixed(2) + ')', 'warn');
    } else {
      DBG.push('-> sem nenhum hit-test (perdeu tracking / aponta p/ vazio)', 'warn');
    }
    _dbgLastWallState = curState;
  }

  // resumo throttled: 1x por segundo
  if (timestamp - _dbgLastSummary > 1000){
    let line = 'frames/s~' + _dbgFrameCount
      + ' | hits agora=' + results.length
      + ' | max hits=' + _dbgMaxHits;
    if (normalsInfo.length){
      const n = normalsInfo[0];
      line += ' | normal[0]=(' + n.x.toFixed(2) + ','
        + n.y.toFixed(2) + ',' + n.z.toFixed(2) + ')'
        + (n.wall ? ' PAREDE' : ' nao-parede');
    }
    DBG.push(line);
    _dbgLastSummary = timestamp;
    _dbgFrameCount = 0;
  }

  if (wallHit){
    const wallPose = poseOnWall(wallHit);
    reticle.visible = true;
    reticle.matrix.copy(wallPose);
    if (!posterPlaced){
      sizePreview.visible = true;
      sizePreview.matrix.copy(wallPose);
      setStatus('Parede encontrada — toque para fixar o quadro');
    } else {
      sizePreview.visible = false;
    }
  } else {
    reticle.visible = false;
    sizePreview.visible = false;
    if (!posterPlaced && results.length > 0){
      setStatus('Superfície detectada não é vertical — aponte para a parede');
    } else if (!posterPlaced){
      setStatus('Procurando parede… mova o celular devagar');
    }
  }

  renderer.render(scene, camera);
}
</script>
